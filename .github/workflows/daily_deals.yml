# This single-user GitHub Actions workflow has been replaced by the dynamic multi-user
# 24/7 Bot (bot.py) running on Render / Cloud.
# 
# Scheduled broadcasts for all users (12:05am, 6am, 12pm, 4pm, 8pm IST) are handled
# automatically by bot.py's internal scheduler.
#
# If you ever want to run a manual single-user broadcast via GitHub Actions, uncomment
# the trigger below and configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in GitHub Secrets.

name: JioMart Single User Alert (Optional / Inactive)

on:
  workflow_dispatch: # Manual run only (no automated cron triggers)
    inputs:
      min_discount:
        description: 'Minimum Discount %'
        required: false
        default: '60'

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: echo "Automated multi-user broadcasts are handled directly by bot.py on Render."
