name: JioMart Scheduled Deal Broadcasts

on:
  schedule:
    # 12:05 AM IST = 18:35 UTC (previous day)
    - cron: '35 18 * * *'
    # 06:00 AM IST = 00:30 UTC
    - cron: '30 0 * * *'
    # 12:00 PM IST = 06:30 UTC
    - cron: '30 6 * * *'
    # 04:00 PM IST = 10:30 UTC
    - cron: '30 10 * * *'
    # 08:00 PM IST = 14:30 UTC
    - cron: '30 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web interface anytime

jobs:
  broadcast-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Multi-User Deal Broadcaster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python broadcast_runner.py
