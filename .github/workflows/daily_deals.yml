# Automated 5x daily scheduled broadcasts (12:05am, 6am, 12pm, 4pm, 8pm IST)
# and live on-demand clicks (/deals, /more, /search) are handled 24/7 by bot.py on Render
# kept awake via cron-job.org.
#
# This workflow is kept for optional manual testing via the GitHub Actions UI.

name: JioMart Deal Broadcaster (Manual Dispatch)

on:
  workflow_dispatch: # Manual run only (no automated cron triggers)
    inputs:
      min_discount:
        description: 'Minimum Discount %'
        required: false
        default: '60'

jobs:
  broadcast-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Multi-User Deal Broadcaster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python broadcast_runner.py
